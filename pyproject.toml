[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aubrey-fortune-area"
version = "0.1.0"
description = "A small Python command-line project."
requires-python = ">=3.10"

[project.scripts]
aubrey-area = "aubrey_fortune_area.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
